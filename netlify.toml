[build]
  # Frontend build command - builds the React/Vite app
  command = "cd app && npm run build && cd .. && node scripts/dump-db-to-json.js && node scripts/copy-json-to-dist.js"
  # Directory to publish (the frontend build output)
  publish = "app/dist"
  # Node version
  node_version = "20.x"

# Environment variables
[build.environment]
  NODE_ENV = "production"
  VITE_API_URL = "/.netlify/functions"

# Redirect all API calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback - send all non-matched routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache settings for static assets
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "ALLOW-FROM https://ausfinancetools.netlify.app"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"

# Function configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
